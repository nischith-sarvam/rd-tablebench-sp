<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
      color: #333;
      border: 1px solid #ddd;
    }

    page {
      display: block;
      max-width: 100%; /* Ensure the page does not exceed the viewport width */
      overflow-x: auto; /* Add horizontal scrollbar if content overflows */
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      border-bottom: 1px solid #ddd;
      padding-bottom: 0.3em;
    }

    h1 {
      font-size: 2em;
    }

    h2 {
      font-size: 1.5em;
    }

    h3 {
      font-size: 1.17em;
    }

    h4 {
      font-size: 1em;
    }

    h5 {
      font-size: 0.83em;
    }

    h6 {
      font-size: 0.67em;
    }

    p {
      margin: 0.75em 0;
    }

    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      margin: 20px auto;
      padding: 20px;
      background-color: #fff;
      color: #333;
      border: 1px solid #ddd;
    }

    ul,
    ol {
      padding-left: 20px;
    }

    table {
        table-layout : auto;
        max-width: 100%;
      border-collapse: collapse;
      width: 100%;
    }

    th,
    td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }

    th {
      background-color: #f2f2f2;
    }

    img {
      max-width: 100%;
      height: auto;
    }

    chapter-title {
      display: block;
      font-size: 3em;
      font-weight: bold;
      color: black;
      border-bottom: 1px solid #ddd;
      padding-bottom: 0.3em;
    }

    page-module {
      display: block;
      background-color: #d3d3d3;
    }

    list-item {
      display: block;
    }

    page-header {
      border-bottom: 1px solid #ddd;
      display: block;
      margin-bottom: 16px;
      text-align: center;
    }

    page-footer {
      border-top: 1px solid #ddd;
      display: block;
      margin-top: 16px;
      text-align: center;
    }

    toc {
      padding: 10px;
    }

    toc-item {
      margin: 5px 0;
      padding: 2px 5px;
      display: block;
    }
  </style>
  </head>

  </body>
</html>
